services:
  backend:
    build:
      context: ../../app/backend
      dockerfile: Dockerfile
    container_name: s210-backend
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - s210-network

  frontend:
    build:
      context: ../..
      dockerfile: app/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://backend:8080}
    container_name: s210-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ../.env
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - s210-network

networks:
  s210-network:
    external: true
    name: ${DOCKER_NETWORK_NAME:-s210-network}
