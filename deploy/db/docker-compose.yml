services:
  mysql:
    image: mysql:8.4
    container_name: s210-mysql
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - s210-network

volumes:
  mysql-data:

networks:
  s210-network:
    name: ${DOCKER_NETWORK_NAME:-s210-network}
