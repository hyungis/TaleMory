spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3307/iportfolio?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  jwt:
    access_secret: ${JWT_ACCESS_SECRET}
    refresh_secret: ${JWT_REFRESH_SECRET}

oauth:
  allowed-redirect-uris: ${OAUTH_ALLOWED_REDIRECT_URIS:}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}

# AWS 는 top-level namespace — `aws.s3.bucket` 경로로 참조 (spring.* 은 Spring Boot 전용 영역 유지).
# env-prefix: 같은 버킷에서 환경(local/dev/prod) 격리를 위해 모든 S3 key 앞에 prepend 되는 prefix.
# IDE 로컬 실행 시 default `local` 로 떨어지도록 — 사고로 dev/prod prefix 에 쓰는 것 방지.
aws:
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET:}
    env-prefix: ${AWS_S3_ENV_PREFIX:local}

# 외부 노출 ID 토큰 인코더 (Sqids). alphabet 은 비밀 — 실제 운영 값은 GitLab CI variables 에서 주입.
# 아래 default 는 로컬/테스트용 — 운영 배포에선 반드시 APP_ID_CODEC_ALPHABET 으로 override 한다
# (default 가 그대로 노출되면 토큰 추측 가능). alphabet 길이는 26+ 권장.
# min-length 는 8 정도면 시각적으로 충분히 의도가 드러나면서도 URL 이 짧음.
# log-conversions: 디버깅 시 true. 운영 default false (토큰 평문 로그 노출 방지).
app:
  id-codec:
    alphabet: ${APP_ID_CODEC_ALPHABET:Hf3xN8YwQa2ZRu7TgBVe5KcLJpDvy1MEnUbi9mWoXrSC4qzAjPsd6FOhk0lI}
    min-length: ${APP_ID_CODEC_MIN_LENGTH:8}
    log-conversions: ${APP_ID_CODEC_LOG:false}


