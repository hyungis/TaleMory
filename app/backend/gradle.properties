# CI/local 빌드 공통 — Gradle 빌드 캐시 + 병렬화 + JVM heap 튜닝.
#
# - parallel:           프로젝트가 단일 모듈이라 직접 효과는 작지만 향후 multi-module 분할 대비.
# - caching:            task output 재사용 (특히 kotlin compile). incremental 보다 강한 cross-build 캐시.
# - configureondemand:  필요한 sub-project 만 configure — 단일 모듈이라 영향 미미.
# - jvmargs:            CI 컨테이너 OOM 예방 + Kotlin compiler 메모리 여유. 호스트 RAM 에 따라 조정.
#
# - kotlin.incremental:           Kotlin 2.x default true 지만 명시.
# - kotlin.parallel.tasks.in.project: 같은 project 의 task 병렬 (kotlin 2.x).
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

kotlin.incremental=true
kotlin.parallel.tasks.in.project=true
