# 로컬 개발용 nginx upstream.
# 루트 docker-compose.yml의 짧은 서비스명(backend, ai)을 참조.
# CI/운영은 nginx.dev.conf / nginx.prod.conf 사용 (dev-*/prod-* 접두사).

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8080/;
    include /etc/nginx/conf.d/common.conf;
  }

  location /ai/ {
    proxy_pass http://ai:8000/;
    include /etc/nginx/conf.d/common.conf;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
