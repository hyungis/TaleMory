# 로컬 개발용 nginx upstream.
# 루트 docker-compose.yml의 짧은 서비스명(backend) 를 참조.
# ai(FastAPI) 는 어떤 환경에서도 컨테이너로 기동하지 않음 — 로컬 개발자는 `uvicorn main:app` 로 직접 실행.
# CI/운영은 nginx.dev.conf / nginx.prod.conf 사용 (dev-*/prod-* 접두사).

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # /api/ : trailing slash 없음 → prefix 보존. backend(Spring) 컨트롤러는
  # @RequestMapping("/api/...") 로 매칭. 예) /api/health → backend /api/health.
  location /api/ {
    proxy_pass http://backend:8080;
    include /etc/nginx/conf.d/common.conf;
  }

  # /static/ : AI 워커가 생성한 TTS audio / preview wav 정적 서빙.
  # docker-compose 의 `ai-tts-storage` named volume 을 통해 워커와 nginx 가 공유.
  #   워커: /app/.runtime/storage/generated/voice-preview/.../preview_xxx.wav
  #   nginx: /var/www/tts/generated/voice-preview/.../preview_xxx.wav
  #   브라우저: /static/generated/voice-preview/.../preview_xxx.wav
  # `try_files ... =404` 로 SPA fallback (`/index.html`) 충돌 차단 — 파일 없으면 404 반환.
  # TTS_STORAGE_MODE=local 일 때만 사용. s3 모드에선 트래픽 안 옴.
  location /static/ {
    alias /var/www/tts/;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
    types {
      audio/wav  wav;
      audio/mpeg mp3;
      audio/ogg  ogg;
    }
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
