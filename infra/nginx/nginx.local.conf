# 로컬 개발용 nginx upstream.
# 루트 docker-compose.yml의 짧은 서비스명(backend) 를 참조.
# ai(FastAPI) 는 어떤 환경에서도 컨테이너로 기동하지 않음 — 로컬 개발자는 `uvicorn main:app` 로 직접 실행.
# CI/운영은 nginx.dev.conf / nginx.prod.conf 사용 (dev-*/prod-* 접두사).

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # /api/ : trailing slash 없음 → prefix 보존. backend(Spring) 컨트롤러는
  # @RequestMapping("/api/...") 로 매칭. 예) /api/health → backend /api/health.
  location /api/ {
    proxy_pass http://backend:8080;
    include /etc/nginx/conf.d/common.conf;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
