server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # /api/ : trailing slash 없음 → prefix 보존. backend(Spring) 컨트롤러는
  # @RequestMapping("/api/...") 로 매칭. 예) /api/health → backend /api/health.
  location /api/ {
    proxy_pass http://prod-backend:8080;
    include /etc/nginx/conf.d/common.conf;
  }

  # /ai/  : trailing slash 있음 → prefix 제거. FastAPI 라우트는 bare path(/health 등)
  # 로 정의되어 있음. 예) /ai/health → ai /health.
  location /ai/ {
    proxy_pass http://prod-ai:8000/;
    include /etc/nginx/conf.d/common.conf;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
