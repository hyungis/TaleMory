# ── HTTP 80: ACME challenge 유지 + 나머지는 HTTPS 로 301 리다이렉트 ──
# Let's Encrypt 갱신을 standalone(nginx 중단 후 발급) 으로 할 경우 `/.well-known/...`
# location 은 실질적으로 사용되지 않지만, webroot 모드로 갈아탈 때를 대비해 남겨둠.
server {
  listen 80;
  server_name k14s210.p.ssafy.io;

  # (선택) webroot 기반 갱신을 쓸 때 certbot 이 이 경로로 challenge 파일을 둠.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ── HTTPS 443: 실제 서비스 ─────────────────────────────────────────
server {
  listen 443 ssl http2;
  server_name k14s210.p.ssafy.io;

  ssl_certificate     /etc/letsencrypt/live/k14s210.p.ssafy.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/k14s210.p.ssafy.io/privkey.pem;

  # Mozilla intermediate 프로필 (TLS 1.2 + 1.3)
  ssl_session_timeout 1d;
  ssl_session_cache   shared:MozSSL:10m;
  ssl_session_tickets off;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;

  # HSTS: 초기에는 10분(600) 만 지속 — 설정 문제 시 롤백 가능.
  # 안정화되면 `max-age=31536000; includeSubDomains` 로 상향 권장.
  add_header Strict-Transport-Security "max-age=600" always;

  root /usr/share/nginx/html;
  index index.html;

  # /api/ : trailing slash 없음 → prefix 보존. backend(Spring) 컨트롤러는
  # @RequestMapping("/api/...") 로 매칭. 예) /api/health → backend /api/health.
  location /api/ {
    proxy_pass http://prod-backend:8080;
    include /etc/nginx/conf.d/common.conf;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
