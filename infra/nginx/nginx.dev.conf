# ── HTTP 80: 그대로 유지 (팀 로컬 테스트 / curl 용) ──────────────────
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://dev-backend:8080;
    include /etc/nginx/conf.d/common.conf;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# ── HTTPS 443 (host 3443→container 443): dev HTTPS ────────────────────
# master와 동일 인증서(k14s210.p.ssafy.io)를 재사용.
# HSTS 헤더 없음 — master(prod) 가 이미 도메인 레벨 HSTS 를 설정하므로
# dev 에서 중복 선언 불필요. 브라우저는 master HSTS 로 자동 적용됨.
server {
  listen 443 ssl http2;
  server_name k14s210.p.ssafy.io;

  ssl_certificate     /etc/letsencrypt/live/k14s210.p.ssafy.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/k14s210.p.ssafy.io/privkey.pem;

  # Mozilla intermediate 프로필 (TLS 1.2 + 1.3)
  ssl_session_timeout 1d;
  ssl_session_cache   shared:MozSSL:10m;
  ssl_session_tickets off;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;

  # 평문 HTTP 요청이 SSL 포트로 들어오면 nginx 가 497 을 반환함.
  # → 동일 URL 을 https 로 강제 리다이렉트. `http://host:3443/` 북마크/오타 대응.
  # 외부 포트(3443)를 하드코딩 — container 는 443 이지만 사용자에게 보이는 포트는 3443.
  error_page 497 https://$host:3443$request_uri;

  root /usr/share/nginx/html;
  index index.html;

  # /api/ : trailing slash 없음 → prefix 보존. backend(Spring) 컨트롤러는
  # @RequestMapping("/api/...") 로 매칭. 예) /api/health → backend /api/health.
  location /api/ {
    proxy_pass http://dev-backend:8080;
    include /etc/nginx/conf.d/common.conf;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
