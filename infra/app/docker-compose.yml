services:
  backend:
    build:
      context: ../../app/backend
      dockerfile: Dockerfile
    container_name: s210-backend
    restart: unless-stopped
    env_file:
      - ../.env
    expose:
      - "8080"
    networks:
      - s210-network

  ai:
    build:
      context: ../../app/ai
      dockerfile: Dockerfile
    container_name: s210-ai
    restart: unless-stopped
    env_file:
      - ../.env
    expose:
      - "8000"
    networks:
      - s210-network

  nginx:
    build:
      context: ../..
      dockerfile: infra/app/nginx/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: s210-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - ai
    env_file:
      - ../.env
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - s210-network

networks:
  s210-network:
    external: true
    name: ${DOCKER_NETWORK_NAME:-s210-network}
