services:
  mysql:
    image: mysql:8.4
    container_name: prod-mysql
    restart: unless-stopped
    env_file:
      - ${ENV_DIR:-/tmp/env}/infra.master.env
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - prod-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - prod-infra-net

  redis:
    image: redis:7-alpine
    container_name: prod-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    env_file:
      - ${ENV_DIR:-/tmp/env}/infra.master.env
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - prod-redis-data:/data
    networks:
      - prod-infra-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: prod-rabbitmq
    restart: unless-stopped
    env_file:
      - ${ENV_DIR:-/tmp/env}/infra.master.env
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - prod-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - prod-infra-net

networks:
  prod-infra-net:
    name: prod-s210-infra-net

volumes:
  prod-mysql-data:
  prod-redis-data:
  prod-rabbitmq-data:
