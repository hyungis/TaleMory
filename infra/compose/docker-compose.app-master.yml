services:
  nginx:
    image: ${REGISTRY:+${REGISTRY}/}${PROJECT_NAME:-s210}-frontend:${APP_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: prod-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - ai
    env_file:
      - ${ENV_DIR:-/tmp/env}/app.master.env
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ../nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/nginx.common.conf:/etc/nginx/conf.d/common.conf:ro
    networks:
      - prod-app-net
      - prod-infra-net

  backend:
    image: ${REGISTRY:+${REGISTRY}/}${PROJECT_NAME:-s210}-backend:${APP_IMAGE_TAG:-latest}
    build:
      context: ../../app/backend
      dockerfile: Dockerfile
    container_name: prod-backend
    restart: unless-stopped
    env_file:
      - ${ENV_DIR:-/tmp/env}/app.master.env
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - prod-app-net
      - prod-infra-net

  ai:
    image: ${REGISTRY:+${REGISTRY}/}${PROJECT_NAME:-s210}-ai:${APP_IMAGE_TAG:-latest}
    build:
      context: ../../app/ai
      dockerfile: Dockerfile
    container_name: prod-ai
    restart: unless-stopped
    env_file:
      - ${ENV_DIR:-/tmp/env}/app.master.env
    ports:
      - "${AI_PORT:-8000}:8000"
    networks:
      - prod-app-net
      - prod-infra-net

networks:
  prod-app-net:
    name: prod-s210-app-net
  prod-infra-net:
    external: true
    name: prod-s210-infra-net
