services:
  nginx:
    image: ${IMAGE_PREFIX:-s210}-frontend:${APP_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: prod-nginx
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ${ENV_DIR:-/tmp/env}/app.master.env
    ports:
      - "80:80"     # HTTP → HTTPS redirect (+ ACME webroot 갱신 예비)
      - "443:443"   # HTTPS 본체
    volumes:
      - ../nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/nginx.common.conf:/etc/nginx/conf.d/common.conf:ro
      # Let's Encrypt 인증서: 호스트의 /etc/letsencrypt 를 컨테이너에 read-only 로 마운트.
      # 서버에서 certbot 갱신 후 nginx 컨테이너 reload/restart 하면 새 cert 반영.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # webroot 모드 갱신을 쓸 경우 challenge 파일 공유용. standalone 만 쓸 거면 생략 가능.
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - prod-app-net
      - prod-infra-net

  backend:
    image: ${IMAGE_PREFIX:-s210}-backend:${APP_IMAGE_TAG:-latest}
    build:
      context: ../../app/backend
      dockerfile: Dockerfile
    container_name: prod-backend
    restart: unless-stopped
    env_file:
      - ${ENV_DIR:-/tmp/env}/app.master.env
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - prod-app-net
      - prod-infra-net

  ai-worker:
    image: ${IMAGE_PREFIX:-s210}-ai:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "worker.py"]
    scale: ${AI_WORKER_REPLICAS:-1}
    env_file:
      - ${ENV_DIR:-/tmp/env}/app.master.env
    networks:
      - prod-app-net
      - prod-infra-net

networks:
  prod-app-net:
    name: prod-s210-app-net
  prod-infra-net:
    external: true
    name: prod-s210-infra-net