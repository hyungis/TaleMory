services:
  nginx:
    image: ${IMAGE_PREFIX:-s210}-frontend:${APP_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: dev-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - ai
    env_file:
      - ${ENV_DIR:-/tmp/env}/app.dev.env
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    volumes:
      - ../nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/nginx.common.conf:/etc/nginx/conf.d/common.conf:ro
    networks:
      - dev-app-net
      - dev-infra-net

  backend:
    image: ${IMAGE_PREFIX:-s210}-backend:${APP_IMAGE_TAG:-latest}
    build:
      context: ../../app/backend
      dockerfile: Dockerfile
    container_name: dev-backend
    restart: unless-stopped
    env_file:
      - ${ENV_DIR:-/tmp/env}/app.dev.env
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    networks:
      - dev-app-net
      - dev-infra-net

  ai:
    image: ${IMAGE_PREFIX:-s210}-ai:${APP_IMAGE_TAG:-latest}
    build:
      context: ../../app/ai
      dockerfile: Dockerfile
    container_name: dev-ai
    restart: unless-stopped
    env_file:
      - ${ENV_DIR:-/tmp/env}/app.dev.env
    ports:
      - "${AI_PORT:-8001}:8000"
    networks:
      - dev-app-net
      - dev-infra-net

networks:
  dev-app-net:
    name: dev-s210-app-net
  dev-infra-net:
    external: true
    name: dev-s210-infra-net
