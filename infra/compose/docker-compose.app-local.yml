
name: s210-local

services:
  backend:
    build:
      context: ../../app/backend
      dockerfile: Dockerfile
    image: s210-backend:local
    container_name: local-backend
    restart: unless-stopped
    env_file:
      - ../env/app.local.env
    environment:
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_PORT:-8081}:8080"

  ai-worker:
    build:
      context: ../../app/ai
      dockerfile: Dockerfile
    image: s210-ai:local
    container_name: local-ai-worker
    restart: unless-stopped
    command: ["python", "worker.py"]
    scale: ${AI_WORKER_REPLICAS:-1}
    env_file:
      - ../env/app.local.env

  nginx:
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_KAKAO_CLIENT_ID: ${VITE_KAKAO_CLIENT_ID:-kakao-rest-api-key-change-me}
    image: s210-frontend:local
    container_name: local-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    volumes:
      - ../nginx/nginx.common.conf:/etc/nginx/conf.d/common.conf:ro
      - ../nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
