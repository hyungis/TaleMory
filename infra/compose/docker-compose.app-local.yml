
name: s210-local

services:
  backend:
    build:
      context: ../../app/backend
      dockerfile: Dockerfile
    image: s210-backend:local
    container_name: local-backend
    restart: unless-stopped
    env_file:
      - ../env/app.local.env
    environment:
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_PORT:-8081}:8080"

  ai-worker:
    build:
      context: ../../app/ai
      dockerfile: Dockerfile
    image: s210-ai:local
    container_name: local-ai-worker
    restart: unless-stopped
    command: ["python", "worker.py"]
    scale: ${AI_WORKER_REPLICAS:-1}
    env_file:
      - ../env/app.local.env
    volumes:
      - ai-tts-storage:/app/.runtime/storage

  ai-tts-story-worker:
    build:
      context: ../../app/ai
      dockerfile: Dockerfile
    image: s210-ai:local
    container_name: local-ai-tts-story-worker
    restart: unless-stopped
    command: ["python", "worker_tts_story.py"]
    scale: ${AI_TTS_STORY_WORKER_REPLICAS:-1}
    env_file:
      - ../env/app.local.env
    volumes:
      - ai-tts-storage:/app/.runtime/storage

  ai-tts-preview-worker:
    build:
      context: ../../app/ai
      dockerfile: Dockerfile
    image: s210-ai:local
    container_name: local-ai-tts-preview-worker
    restart: unless-stopped
    command: ["python", "worker_tts_preview.py"]
    scale: ${AI_TTS_PREVIEW_WORKER_REPLICAS:-1}
    env_file:
      - ../env/app.local.env
    volumes:
      - ai-tts-storage:/app/.runtime/storage

  nginx:
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_KAKAO_CLIENT_ID: ${VITE_KAKAO_CLIENT_ID:-kakao-rest-api-key-change-me}
    image: s210-frontend:local
    container_name: local-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    volumes:
      - ../nginx/nginx.common.conf:/etc/nginx/conf.d/common.conf:ro
      - ../nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      # AI 워커가 저장한 TTS audio 를 nginx 가 /static/ 으로 노출.
      # TTS_STORAGE_MODE=local 일 때만 의미 있음. s3 모드에선 안 쓰임.
      - ai-tts-storage:/var/www/tts:ro

# AI 워커가 만든 TTS 오디오 / preview wav 를 컨테이너 간 공유.
# storyMode=local 흐름:
#   ai 워커 컨테이너  → /app/.runtime/storage/generated/voice-preview/.../preview_xxx.wav
#   nginx 컨테이너    → /var/www/tts/generated/voice-preview/.../preview_xxx.wav (location /static/ alias)
#   브라우저          → /static/generated/voice-preview/.../preview_xxx.wav
volumes:
  ai-tts-storage:
