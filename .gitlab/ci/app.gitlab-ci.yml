# App pipeline — 항상 로드.
# 엔트리(.gitlab-ci.yml)에 stages / workflow / default / variables 가 정의되어 있음.
#
# 포함 job:
#   - generate_env_<env>  : GitLab Variables → env 파일 생성
#   - verify_infra_<env>  : mysql/redis/rabbitmq 실접속 + creds 정렬 검증
#   - build_app           : frontend / backend / ai 통합 빌드 (한 영역만 변경되어도 전체 재빌드)
#   - deploy_<env>        : compose 정의된 모든 서비스 일괄 배포 (인자 없음 → SERVICE=all)
#   - notify_*, cleanup_* : .post
#
# deploy_infra_* 는 여기 없음 → .gitlab/ci/infra.gitlab-ci.yml (조건부 로드).
#
# ── 통합 정책 (이전 서비스별 분리에서 회귀) ─────────────────────
# 이전: 서비스별 build_*/deploy_*_* 분리 — 변경 영역만 build/deploy 하여 빠름.
# 문제: nginx 가 compose `depends_on: backend` 로 backend 도 recreate 시도 → 그 SHA 의
#       backend 이미지가 build skip 되어 존재하지 않으면 pull access denied 로 실패.
# 결정: build/deploy 모두 통합. 한 영역만 변경되어도 전체를 재빌드/재배포한다.
#       BuildKit cache mount + Docker layer cache 로 변경 없는 서비스는 캐시 hit 으로 빠르게 끝남.
#       SHA 태그 일관성 자동 보장 — 변경 없는 서비스도 항상 그 SHA 의 이미지가 존재.

# ─── generate_env ─────────────────────────────────────────────
generate_env_dev:
  stage: generate_env
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  script:
    - bash infra/scripts/generate-env.sh dev

generate_env_master:
  stage: generate_env
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - bash infra/scripts/generate-env.sh master

# ─── verify infra 연결 (build 앞에서 사전 검증) ───────────────
# mysql/redis/rabbitmq 실 접속 + GitLab Variables 정렬 검증.
# infra.gitlab-ci.yml 이 로드된 경우에만 deploy_infra_<env> 가 파이프라인에 존재.
# optional: true 덕분에 로드되지 않은 경우는 needs 가 자동 스킵되어 바로 실행됨.
verify_infra_dev:
  stage: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  needs:
    - generate_env_dev
    - job: deploy_infra_dev
      optional: true
  script:
    - bash infra/scripts/health-check-infra.sh dev

verify_infra_master:
  stage: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  needs:
    - generate_env_master
    - job: deploy_infra_master
      optional: true
  script:
    - bash infra/scripts/health-check-infra.sh master

# ─── build (3개 서비스 통합) ──────────────────────────────────
# 한 job 에서 3개 빌드 스크립트 순차 실행. Docker layer cache + BuildKit cache mount
# 로 변경 없는 서비스는 캐시 hit 으로 빠르게 끝남. changes 필터로 docs/README 등
# 무관한 변경엔 build/deploy 트리거되지 않음.
build_app:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - app/**/*
        - infra/compose/docker-compose.app-dev.yml
        - infra/scripts/build-backend.sh
        - infra/scripts/build-frontend.sh
        - infra/scripts/build-ai.sh
        - infra/scripts/deploy-dev.sh
        - infra/scripts/health-check-dev.sh
        - infra/scripts/common.sh
        - .gitlab-ci.yml
        - .gitlab/ci/app.gitlab-ci.yml
      needs:
        - verify_infra_dev
    - if: '$CI_COMMIT_BRANCH == "master"'
      changes:
        - app/**/*
        - infra/compose/docker-compose.app-master.yml
        - infra/scripts/build-backend.sh
        - infra/scripts/build-frontend.sh
        - infra/scripts/build-ai.sh
        - infra/scripts/deploy-master.sh
        - infra/scripts/health-check-master.sh
        - infra/scripts/common.sh
        - .gitlab-ci.yml
        - .gitlab/ci/app.gitlab-ci.yml
      needs:
        - verify_infra_master
  script:
    - bash infra/scripts/build-backend.sh
    - bash infra/scripts/build-frontend.sh
    - bash infra/scripts/build-ai.sh

# ─── deploy (env 별 일괄 배포) ────────────────────────────────
# deploy-<env>.sh 를 인자 없이 호출 → SERVICE=all → compose 정의된 모든 서비스 한 번에 up.
# depends_on 자동 해석 (nginx 가 backend 보다 늦게 뜸).
deploy_dev:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - app/**/*
        - infra/compose/docker-compose.app-dev.yml
        - infra/scripts/build-backend.sh
        - infra/scripts/build-frontend.sh
        - infra/scripts/build-ai.sh
        - infra/scripts/deploy-dev.sh
        - infra/scripts/health-check-dev.sh
        - infra/scripts/common.sh
        - .gitlab-ci.yml
        - .gitlab/ci/app.gitlab-ci.yml
  needs:
    - generate_env_dev
    - verify_infra_dev
    - build_app
  script:
    - bash infra/scripts/deploy-dev.sh

deploy_master:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      changes:
        - app/**/*
        - infra/compose/docker-compose.app-master.yml
        - infra/scripts/build-backend.sh
        - infra/scripts/build-frontend.sh
        - infra/scripts/build-ai.sh
        - infra/scripts/deploy-master.sh
        - infra/scripts/health-check-master.sh
        - infra/scripts/common.sh
        - .gitlab-ci.yml
        - .gitlab/ci/app.gitlab-ci.yml
      when: manual       # master 는 승인 후 배포
  needs:
    - generate_env_master
    - verify_infra_master
    - build_app
  script:
    - bash infra/scripts/deploy-master.sh

# ─── 수동 유틸: dev RabbitMQ 큐 purge ───────────────────────────
# 큐 스키마 변경 / 스테일 메시지 정리 / 개발 환경 리셋 시 사용.
# - 평소 dev 배포엔 영향 없음 (manual + allow_failure).
# - dev 브랜치 파이프라인에만 버튼이 렌더링됨. master 에선 아예 보이지 않음.
# - 큐 이름은 /tmp/env/app.dev.env 에서 읽음 (하드코딩 없음).
purge_queues_dev:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true
  needs:
    - generate_env_dev
  script:
    - bash infra/scripts/purge-queues.sh dev

# ─── .post: Discord 알림 ──────────────────────────────────────
# jq 필요. 서버에 `sudo apt install -y jq` 한 번 실행해두기.
notify_success:
  stage: .post
  when: on_success
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "master"'
  script:
    - CI_JOB_STATUS=success bash infra/scripts/notify.sh

notify_failure:
  stage: .post
  when: on_failure
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "master"'
  script:
    - CI_JOB_STATUS=failed bash infra/scripts/notify.sh

# ─── .post: 이미지 정리 (notify 이후, 성공 pipeline만) ──────────
# 실패 pipeline 에서는 실행되지 않아 디버깅용 이미지/상태 보존.
# s210-* prefix 만 대상 — healthcheck 용 public 이미지 캐시는 건드리지 않음.
cleanup_dev:
  stage: .post
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: on_success
    - when: never
  needs:
    - notify_success
  script:
    - bash infra/scripts/cleanup-images.sh

cleanup_master:
  stage: .post
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: on_success
    - when: never
  needs:
    - notify_success
  script:
    - bash infra/scripts/cleanup-images.sh
