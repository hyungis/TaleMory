# App pipeline — 항상 로드.
# 엔트리(.gitlab-ci.yml)에 stages / workflow / default / variables 가 정의되어 있음.
#
# 포함 job:
#   - generate_env_<env> : GitLab Variables → env 파일 생성
#   - verify_infra_<env> : mysql/redis/rabbitmq 실접속 + creds 정렬 검증
#   - build_*            : frontend / backend / ai (3개 병렬)
#   - deploy_<env>       : compose up
#   - notify_*, cleanup_*: .post
#
# deploy_infra_*는 여기 없음 → .gitlab/ci/infra.gitlab-ci.yml (조건부 로드).

# ─── generate_env ─────────────────────────────────────────────
generate_env_dev:
  stage: generate_env
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  script:
    - bash infra/scripts/generate-env.sh dev

generate_env_master:
  stage: generate_env
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - bash infra/scripts/generate-env.sh master

# ─── verify infra 연결 (build 앞에서 사전 검증) ───────────────
# mysql/redis/rabbitmq 실 접속 + GitLab Variables 정렬 검증.
# infra.gitlab-ci.yml이 로드된 경우에만 deploy_infra_<env>가 파이프라인에 존재.
# optional:true 덕분에 로드되지 않은 경우는 needs가 자동으로 스킵되어 바로 실행됨.
verify_infra_dev:
  stage: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  needs:
    - generate_env_dev
    - job: deploy_infra_dev
      optional: true
  script:
    - bash infra/scripts/health-check-infra.sh dev

verify_infra_master:
  stage: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  needs:
    - generate_env_master
    - job: deploy_infra_master
      optional: true
  script:
    - bash infra/scripts/health-check-infra.sh master

# ─── build (3개 병렬, verify 통과 후) ─────────────────────────
build_frontend:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      needs:
        - verify_infra_dev
    - if: '$CI_COMMIT_BRANCH == "master"'
      needs:
        - verify_infra_master
  script:
    - bash infra/scripts/build-frontend.sh

build_backend:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      needs:
        - verify_infra_dev
    - if: '$CI_COMMIT_BRANCH == "master"'
      needs:
        - verify_infra_master
  script:
    - bash infra/scripts/build-backend.sh

build_ai:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      needs:
        - verify_infra_dev
    - if: '$CI_COMMIT_BRANCH == "master"'
      needs:
        - verify_infra_master
  script:
    - bash infra/scripts/build-ai.sh

# ─── deploy ───────────────────────────────────────────────────
deploy_dev:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  needs:
    - generate_env_dev
    - verify_infra_dev
    - build_frontend
    - build_backend
    - build_ai
  script:
    - bash infra/scripts/deploy-dev.sh all

deploy_master:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual       # master는 승인 후 배포
  needs:
    - generate_env_master
    - verify_infra_master
    - build_frontend
    - build_backend
    - build_ai
  script:
    - bash infra/scripts/deploy-master.sh all

# ─── .post: Discord 알림 ──────────────────────────────────────
# jq 필요. 서버에 `sudo apt install -y jq` 한 번 실행해두기.
notify_success:
  stage: .post
  when: on_success
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "master"'
  script:
    - CI_JOB_STATUS=success bash infra/scripts/notify.sh

notify_failure:
  stage: .post
  when: on_failure
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "master"'
  script:
    - CI_JOB_STATUS=failed bash infra/scripts/notify.sh

# ─── .post: 이미지 정리 (notify 이후, 성공 pipeline만) ──────────
# 실패 pipeline에서는 실행되지 않아 디버깅용 이미지/상태 보존.
# s210-* prefix만 대상 — healthcheck용 public 이미지 캐시는 건드리지 않음.
cleanup_dev:
  stage: .post
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: on_success
    - when: never
  needs:
    - notify_success
  script:
    - bash infra/scripts/cleanup-images.sh

cleanup_master:
  stage: .post
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: on_success
    - when: never
  needs:
    - notify_success
  script:
    - bash infra/scripts/cleanup-images.sh
